<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Loading">
  <style>
    /* One 2.6s loop: the groundhog pops out of his burrow, looks around, blinks, then ducks back down
       while the hexagon outline chases around him. */
    .hex-base { fill: none; stroke: #ff7b01; stroke-opacity: .16; stroke-width: 6; stroke-linejoin: round; }
    .hex-a, .hex-b {
      fill: none; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 118 410; animation: chase 2.6s linear infinite;
    }
    .hex-a { stroke: #ff7b01; }
    .hex-b { stroke: #5483cc; animation-delay: -1.3s; }
    @keyframes chase { to { stroke-dashoffset: -528; } }

    .hog { animation: pop 2.6s infinite; }
    @keyframes pop {
      0%, 10% { transform: translateY(82px); animation-timing-function: cubic-bezier(.3, 1.55, .5, 1); }
      30%     { transform: translateY(0); }
      66%     { transform: translateY(0); animation-timing-function: cubic-bezier(.5, 0, .85, .4); }
      82%, 100% { transform: translateY(82px); }
    }

    .head { transform-origin: 100px 120px; animation: wobble 2.6s infinite; }
    @keyframes wobble {
      0%, 32% { transform: rotate(0); }
      41%     { transform: rotate(-6deg); }
      53%     { transform: rotate(6deg); }
      62%, 100% { transform: rotate(0); }
    }

    .eyes { transform-origin: 100px 97px; animation: blink 2.6s infinite; }
    @keyframes blink {
      0%, 55%, 61%, 100% { transform: scaleY(1); }
      58% { transform: scaleY(.08); }
    }

    .glow { animation: glow 2.6s infinite; }
    @keyframes glow {
      0%, 28% { opacity: 0; }
      36%, 62% { opacity: .6; }
      70%, 100% { opacity: 0; }
    }

    .crumb { fill: #6b4a2f; opacity: 0; animation: crumb 2.6s infinite; }
    @keyframes crumb {
      0%, 14% { opacity: 0; transform: translate(0, 0); }
      19%     { opacity: 1; }
      38%, 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); }
    }

    @media (prefers-reduced-motion: reduce) {
      .hex-a, .hex-b, .head, .eyes, .glow, .crumb, .hog { animation: none; }
      .hog { transform: none; }
      .glow { opacity: .5; }
    }
  </style>

  <defs>
    <!-- Visible above the burrow line, and inside the opening, so the groundhog rises out of the hole -->
    <clipPath id="burrow">
      <rect x="0" y="0" width="200" height="128"/>
      <ellipse cx="100" cy="128" rx="34" ry="9"/>
    </clipPath>
    <radialGradient id="lamp">
      <stop offset="0" stop-color="#fff3c4" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffd75e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Hexagon outline: the faint track plus two chasing segments -->
  <path class="hex-base" pathLength="528" d="M100 12 L176.2 56 L176.2 144 L100 188 L23.8 144 L23.8 56 Z"/>
  <path class="hex-a" pathLength="528" d="M100 12 L176.2 56 L176.2 144 L100 188 L23.8 144 L23.8 56 Z"/>
  <path class="hex-b" pathLength="528" d="M100 12 L176.2 56 L176.2 144 L100 188 L23.8 144 L23.8 56 Z"/>

  <!-- Mound and burrow -->
  <ellipse cx="100" cy="133" rx="54" ry="13" fill="#4a3626"/>
  <ellipse cx="100" cy="131" rx="50" ry="10" fill="#5a4330"/>
  <ellipse cx="100" cy="128" rx="34" ry="9" fill="#0d1014"/>

  <!-- The groundhog -->
  <g clip-path="url(#burrow)">
    <g class="hog">
      <rect x="76" y="104" width="48" height="64" rx="22" fill="#8a5a32"/>
      <ellipse cx="100" cy="132" rx="14" ry="20" fill="#dcb88a"/>
      <ellipse cx="82" cy="127" rx="6.5" ry="4.5" fill="#6e4524"/>
      <ellipse cx="118" cy="127" rx="6.5" ry="4.5" fill="#6e4524"/>

      <g class="head">
        <circle cx="77" cy="93" r="7.5" fill="#6e4524"/>
        <circle cx="77" cy="93" r="3.6" fill="#d99a7e"/>
        <circle cx="123" cy="93" r="7.5" fill="#6e4524"/>
        <circle cx="123" cy="93" r="3.6" fill="#d99a7e"/>
        <circle cx="100" cy="96" r="24" fill="#9b6a3d"/>
        <ellipse cx="100" cy="106" rx="11.5" ry="8.5" fill="#efd6ab"/>
        <circle cx="85" cy="103" r="4" fill="#e58f7a" fill-opacity=".38"/>
        <circle cx="115" cy="103" r="4" fill="#e58f7a" fill-opacity=".38"/>
        <ellipse cx="100" cy="101.5" rx="4.2" ry="3" fill="#2a1b12"/>
        <rect x="96.9" y="105.2" width="3" height="5.4" rx="1.1" fill="#fff"/>
        <rect x="100.1" y="105.2" width="3" height="5.4" rx="1.1" fill="#fff"/>
        <g class="eyes">
          <circle cx="90" cy="97" r="3.2" fill="#1b1210"/>
          <circle cx="110" cy="97" r="3.2" fill="#1b1210"/>
          <circle cx="91" cy="95.9" r="1.1" fill="#fff"/>
          <circle cx="111" cy="95.9" r="1.1" fill="#fff"/>
        </g>

        <!-- Hard hat with a lamp -->
        <path d="M72 88 A28 27 0 0 1 128 88 Z" fill="#ff7b01"/>
        <rect x="96.5" y="62" width="7" height="26" rx="3.5" fill="#ff9d42"/>
        <rect x="66" y="85.5" width="68" height="6.5" rx="3.25" fill="#e66a00"/>
        <circle class="glow" cx="100" cy="71" r="13" fill="url(#lamp)"/>
        <circle cx="100" cy="71" r="5" fill="#fff3c4" stroke="#ffd75e" stroke-width="1.6"/>
      </g>
    </g>
  </g>

  <!-- Crumbs of dirt as he pops out -->
  <circle class="crumb" cx="68" cy="124" r="2.6" style="--dx:-14px;--dy:-18px"/>
  <circle class="crumb" cx="76" cy="121" r="1.8" style="--dx:-8px;--dy:-24px"/>
  <circle class="crumb" cx="132" cy="124" r="2.6" style="--dx:14px;--dy:-18px"/>
  <circle class="crumb" cx="124" cy="121" r="1.8" style="--dx:8px;--dy:-24px"/>
</svg>
